<style>
  body {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    /* 파스텔 블루-민트 그라데이션 배경 */
    background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
  }
  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  header h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
    color: #0d47a1; /* 진한 네이비 블루 */
  }
  header p {
    margin: 0.25rem 0;
    color: #455a64; /* 회색빛 남색 */
    font-size: 0.95rem;
  }
  .search-box {
    margin: 1rem 0 1.5rem;
    text-align: center;
  }
  .search-box input {
    width: 90%;
    max-width: 480px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    border-radius: 999px;
    border: 1px solid #90caf9;
    background-color: #ffffffdd;
    box-shadow: 0 1px 3px rgba(13, 71, 161, 0.12);
  }
  .search-box input:focus {
    outline: none;
    border-color: #42a5f5;  /* 파란 포인트 */
    box-shadow: 0 0 0 2px rgba(66, 165, 245, 0.25);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 0.9rem 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
    border-top: 4px solid #42a5f5; /* 카드 상단 포인트 라인 */
  }
  .card:nth-child(3n+1) { border-top-color: #42a5f5; } /* 파랑 */
  .card:nth-child(3n+2) { border-top-color: #26a69a; } /* 민트 */
  .card:nth-child(3n+3) { border-top-color: #ffb74d; } /* 주황 */
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.16);
    background-color: #f9fbff;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 0.35rem;
    color: #1a237e; /* 진한 남색 */
  }
  .card p {
    font-size: 0.9rem;
    margin: 0 0 0.5rem;
    color: #546e7a;
  }
  .card a {
    display: inline-block;
    font-size: 0.88rem;
    color: #1565c0;
    text-decoration: none;
    margin-right: 0.4rem;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    background-color: #e3f2fd;
  }
  .card a:hover {
    background-color: #bbdefb;
    text-decoration: none;
  }
  section.fb-section {
    margin-top: 2rem;
  }
  section.fb-section h2 {
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
    color: #0d47a1;
  }
  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #607d8b;
    text-align: center;
  }
</style>
